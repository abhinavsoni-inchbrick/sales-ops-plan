<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Decision Tracker — Sales Ops</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="page-header">
    <div class="container header-row">
      <div>
        <p class="eyebrow">Decisions</p>
        <h1>Meeting Decision Tracker</h1>
        <p class="muted">Printable view and finalize snapshot (PNG).</p>
      </div>
      <div>
        <a class="secondary-button" href="index.html">Back</a>
      </div>
    </div>
  </header>
  <main class="container">
    <div id="decision-root"></div>
    <div style="margin-top:12px; display:flex; gap:8px;">
      <button id="finalize" class="primary-button">Finalize meeting (PNG)</button>
      <button id="export-csv" class="secondary-button">Export CSV</button>
    </div>
  </main>
  <footer class="footer"><div class="container"><p>Decisions are stored in your browser localStorage.</p></div></footer>

  <script type="module">
    import { SODATA, SODATA_ORDER } from './assets/js/data.js';
    function loadState(id){ try{return JSON.parse(localStorage.getItem('sop:'+id))||{} }catch(e){return{}} }
    function render(){
      const root = document.getElementById('decision-root'); root.innerHTML='';
      const tbl = document.createElement('table'); tbl.style.width='100%'; tbl.style.borderCollapse='collapse';
      const thead = document.createElement('thead'); thead.innerHTML='<tr><th style="text-align:left">ID</th><th>Title</th><th>Decision</th><th>Notes</th></tr>';
      tbl.appendChild(thead);
      const tbody = document.createElement('tbody');
      SODATA_ORDER.forEach(id=>{
        const data = SODATA[id]; const st = loadState(id);
        const tr = document.createElement('tr'); tr.innerHTML = `<td>${id}</td><td>${data.title}</td><td>${st.decision||''}</td><td>${(st.notes||'')}</td>`;
        tr.style.borderTop='1px solid rgba(255,255,255,0.04)'; tr.style.padding='8px';
        tbody.appendChild(tr);
      });
      tbl.appendChild(tbody); root.appendChild(tbl);
    }
    render();
    document.getElementById('export-csv').addEventListener('click', ()=>{ const rows=[['id','title','decision','notes']]; SODATA_ORDER.forEach(id=>{const d=SODATA[id]; const s=loadState(id); rows.push([id,d.title,s.decision||'',(s.notes||'')]);}); const csv = rows.map(r=>r.map(c=>`"${(c||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n'); const blob=new Blob([csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='sop-decisions.csv'; a.click(); });

    // Use html2canvas to capture snapshot
    const finalizeBtn = document.getElementById('finalize');
    finalizeBtn.addEventListener('click', async ()=>{
      const s = document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'; document.body.appendChild(s);
      s.onload = async ()=>{
        const node = document.querySelector('main');
        const canvas = await html2canvas(node, { scale: 1 });
        const url = canvas.toDataURL('image/png');
        const a = document.createElement('a'); a.href = url; a.download = 'meeting-decision-snapshot.png'; a.click();
      };
    });
  </script>
</body>
</html>
